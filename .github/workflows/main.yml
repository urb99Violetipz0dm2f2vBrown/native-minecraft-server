name: Build Native Minecraft Server

on:
  push:
    branches:
      - main
    tags:
      - 'v-*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-15-intel
            arch: amd64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup GraalVM
        id: setup-graalvm
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 针对 Windows 平台，设置 GRAALVM_HOME（优先使用 setup-graalvm 的输出，如果有）
      - name: Configure GraalVM environment on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $graalvmDir = "${{ steps.setup-graalvm.outputs.graalvm-directory }}"
          if ($graalvmDir -and (Test-Path $graalvmDir)) {
            $javaHome = $graalvmDir
          } elseif ($env:JAVA_HOME -and (Test-Path $env:JAVA_HOME)) {
            $javaHome = $env:JAVA_HOME
          } else {
            Write-Error "Unable to determine GraalVM/JAVA_HOME on Windows runner."
          }

          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GRAALVM_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 针对 Windows 平台使用 PowerShell 执行 build.ps1
      - name: Build and run native Minecraft server (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Write-Output "Building for OS=${env:TARGET_OS} and ARCH=${env:TARGET_ARCH}"
          .\build.ps1

      # Linux 平台使用 Bash 显式执行 build.sh
      - name: Build and run native Minecraft server (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        shell: bash
        run: |
          echo "Building for OS=${TARGET_OS} and ARCH=${TARGET_ARCH}"
          chmod 775 ./build.sh
          bash ./build.sh

      # macOS 平台使用 Bash 显式执行 build-macos.sh
      - name: Build and run native Minecraft server (macOS)
        if: ${{ startsWith(matrix.os, 'macos-') }}
        shell: bash
        run: |
          echo "Building for OS=${TARGET_OS} and ARCH=${TARGET_ARCH}"
          chmod 775 ./build-macos.sh
          if [[ "${TARGET_ARCH}" == "arm64" ]]; then
            echo "Using reduced parallelism and explicit heap settings for macOS arm64"
            bash ./build-macos.sh --parallelism=2 -J-Xms1g -J-Xmx5g
          else
            bash ./build-macos.sh
          fi

      # 上传各平台构建产物
      # Windows 下上传指定路径的构建产物
      - name: Upload Build Artifact (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: "minecraft-server-${{ matrix.os }}-${{ matrix.arch }}"
          path: |
            build/META-INF/native-minecraft-server.exe
            build/**/*.dll

      # Linux 和 macOS 下上传主程序以及本地动态库
      - name: Upload Build Artifact (Non-Windows)
        if: ${{ matrix.os != 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: "minecraft-server-${{ matrix.os }}-${{ matrix.arch }}"
          path: |
            ./native-minecraft-server
            build/**/*.so
            build/**/*.dylib

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      # 下载所有构建产物到 artifacts 目录
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      # 对每个构建产物单独打包成 zip 文件
      - name: Zip individual build artifacts for release
        run: |
          for dir in ./*; do
            if [ -d "$dir" ]; then
              zip -r "${dir}.zip" "$dir"
            fi
          done

      # 设置日期用于 release tag（格式为 YYYY.MM.DD）
      - name: Set up date
        id: date
        run: echo "DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      # 创建 release，并上传所有单独打包好的 zip 文件
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.DATE }}
          name: Release v${{ env.DATE }}
          draft: false
          prerelease: false
          files: ./*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

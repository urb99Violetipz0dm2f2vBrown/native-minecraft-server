name: Build Native Minecraft Server

on:
  push:
    branches:
      - main
    tags:
      - 'v-*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    outputs:
      server_version: ${{ steps.meta.outputs.server_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-latest
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: amd64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      SERVER_VERSION: 1.21.11
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup GraalVM
        id: setup-graalvm
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v-* ]]; then
            server_version="${GITHUB_REF_NAME#v-}"
          else
            server_version="${SERVER_VERSION}"
          fi

          base_tag="v-${server_version}"
          release_tag="${base_tag}"

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            if [[ ! ("${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == "${base_tag}") ]]; then
              if git ls-remote --exit-code --tags origin "refs/tags/${base_tag}" >/dev/null 2>&1; then
                release_tag="${base_tag}-$(date -u +%F)"
              fi
            fi
          fi

          {
            echo "SERVER_VERSION=${server_version}"
            echo "RELEASE_TAG=${release_tag}"
          } >> "${GITHUB_ENV}"

          {
            echo "server_version=${server_version}"
            echo "release_tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Configure GraalVM environment on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $graalvmDir = "${{ steps.setup-graalvm.outputs.graalvm-directory }}"
          if ($graalvmDir -and (Test-Path $graalvmDir)) {
            $javaHome = $graalvmDir
          } elseif ($env:JAVA_HOME -and (Test-Path $env:JAVA_HOME)) {
            $javaHome = $env:JAVA_HOME
          } else {
            Write-Error "Unable to determine GraalVM/JAVA_HOME on Windows runner."
          }

          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GRAALVM_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure GraalVM environment on Non-Windows
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          graalvm_dir="${{ steps.setup-graalvm.outputs.graalvm-directory }}"
          if [[ -n "${graalvm_dir}" && -d "${graalvm_dir}" ]]; then
            java_home="${graalvm_dir}"
          elif [[ -n "${JAVA_HOME:-}" && -d "${JAVA_HOME}" ]]; then
            java_home="${JAVA_HOME}"
          else
            echo "Unable to determine GraalVM/JAVA_HOME on non-Windows runner." >&2
            exit 1
          fi

          {
            echo "JAVA_HOME=${java_home}"
            echo "GRAALVM_HOME=${java_home}"
          } >> "${GITHUB_ENV}"

      - name: Build native Minecraft server (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Write-Output "Building for OS=${env:TARGET_OS} and ARCH=${env:TARGET_ARCH}"
          python build.py

      - name: Build native Minecraft server (Non-Windows)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          echo "Building for OS=${TARGET_OS} and ARCH=${TARGET_ARCH}"
          python3 build.py

      - name: Upload Build Artifact (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: "minecraft-server-${{ env.SERVER_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}"
          path: ./native-minecraft-server.exe

      - name: Upload Build Artifact (Non-Windows)
        if: ${{ matrix.os != 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: "minecraft-server-${{ env.SERVER_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}"
          path: ./native-minecraft-server

  release:
    if: ${{ needs.build.result == 'success' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: Zip individual build artifacts for release
        run: |
          for dir in ./*; do
            if [ -d "$dir" ]; then
              zip -r "${dir}.zip" "$dir"
            fi
          done

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: Release ${{ needs.build.outputs.release_tag }}
          draft: false
          prerelease: false
          files: ./*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

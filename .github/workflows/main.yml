name: Build Native Minecraft Server

on:
  push:
    branches:
      - main
    tags:
      - 'v-*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 使用 include 显式配置各平台组合
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '22.2.0'
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 可选：如果需要额外配置环境变量或工具，可在这里添加步骤

      # 仅在 Ubuntu 上检查 build.sh 脚本（确保脚本符合规范）
      - name: Check build.sh
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        shell: bash
        run: shellcheck build.sh
      # 针对 Windows 平台，设置 GRAALVM_HOME（优先使用 setup-graalvm 的输出，如果有）
      - name: Configure GraalVM environment on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $graalvmDir = "${{ steps.setup-graalvm.outputs.graalvm-directory }}"
          if ($graalvmDir -and (Test-Path $graalvmDir)) {
            $env:JAVA_HOME = $graalvmDir
          } else {
            $env:JAVA_HOME = "C:\hostedtoolcache\windows\graalvm-jdk-21_windows-x64_bin\21.0.0\x64\graalvm-jdk-21.0.6+8.1"
          }
          $env:GRAALVM_HOME = $env:JAVA_HOME

      # 针对 Windows 平台使用 PowerShell 执行 build.ps1
      - name: Build and run native Minecraft server (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Write-Output "Building for OS=${env:TARGET_OS} and ARCH=${env:TARGET_ARCH}"
          .\build.ps1

      # 针对 Ubuntu 与 macOS 平台使用 Bash 执行对应的构建脚本
      - name: Build and run native Minecraft server (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          echo "Building for OS=${TARGET_OS} and ARCH=${TARGET_ARCH}"
          if [[ "${TARGET_OS}" == "macos-latest" ]]; then
            chmod 775 ./build-macos.sh
            ./build-macos.sh
          else
            ./build.sh
          fi

      # 上传各平台构建产物（假设构建产物位于 ./native-minecraft-server 目录下）
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-${{ matrix.os }}-${{ matrix.arch }}
          path: .

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      # 下载所有构建产物到 artifacts 目录
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 对每个构建产物单独打包成 zip 文件
      - name: Zip individual build artifacts for release
        run: |
          for dir in artifacts/*; do
            if [ -d "$dir" ]; then
              zip -r "${dir}.zip" "$dir"
            fi
          done

      # 设置日期用于 release tag（格式为 YYYY.MM.DD）
      - name: Set up date
        id: date
        run: echo "DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      # 创建 release，并上传所有单独打包好的 zip 文件
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.DATE }}
          name: Release v${{ env.DATE }}
          draft: false
          prerelease: false
          files: artifacts/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

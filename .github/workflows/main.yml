name: Build Native Minecraft Server

on:
  push:
    branches:
      - main
    tags:
      - 'v-*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-latest
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: amd64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup GraalVM
        id: setup-graalvm
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GraalVM environment on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $graalvmDir = "${{ steps.setup-graalvm.outputs.graalvm-directory }}"
          if ($graalvmDir -and (Test-Path $graalvmDir)) {
            $javaHome = $graalvmDir
          } elseif ($env:JAVA_HOME -and (Test-Path $env:JAVA_HOME)) {
            $javaHome = $env:JAVA_HOME
          } else {
            Write-Error "Unable to determine GraalVM/JAVA_HOME on Windows runner."
          }

          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GRAALVM_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and run native Minecraft server (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Write-Output "Building for OS=${env:TARGET_OS} and ARCH=${env:TARGET_ARCH}"
          .\build.ps1

      - name: Build and run native Minecraft server (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        shell: bash
        run: |
          echo "Building for OS=${TARGET_OS} and ARCH=${TARGET_ARCH}"
          chmod 775 ./build.sh
          bash ./build.sh


      - name: Build and run native Minecraft server (macOS)
        if: ${{ startsWith(matrix.os, 'macos-') }}
        shell: bash
        run: |
          echo "Building for OS=${TARGET_OS} and ARCH=${TARGET_ARCH}"
          chmod 775 ./build-macos.sh
          bash ./build-macos.sh

      - name: Upload Build Artifact (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: "minecraft-server-${{ matrix.os }}-${{ matrix.arch }}"
          path: ./native-minecraft-server.exe

      - name: Upload Build Artifact (Non-Windows)
        if: ${{ matrix.os != 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: "minecraft-server-${{ matrix.os }}-${{ matrix.arch }}"
          path: ./native-minecraft-server

  release:
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: Zip individual build artifacts for release
        run: |
          for dir in ./*; do
            if [ -d "$dir" ]; then
              zip -r "${dir}.zip" "$dir"
            fi
          done

      - name: Set up date
        id: date
        run: echo "DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.DATE }}
          name: Release v${{ env.DATE }}
          draft: false
          prerelease: false
          files: ./*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
